<main>
<h1>Contact me</h1>
<div class="success" id="success" role="status">Thanks! Your message has been checked and is ready to send.</div>
<form id="contact-form" novalidate>
<div><label for="name">Name</label><input type="text" id="name" name="name"><p class="error" id="name-error"></p></div>
<div><label for="email">Email address</label><input type="email" id="email" name="email"><p class="error" id="email-error"></p></div>
<div><label for="phone">Phone number</label><input type="text" id="phone" name="phone" inputmode="numeric"><p class="error" id="phone-error"></p></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><p class="error" id="message-error"></p></div>
<button class="btn" type="submit">Send message</button>
</form>
</main>
