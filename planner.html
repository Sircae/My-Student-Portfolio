<main>
<h1>Academic planner</h1>
<p>Add assignments, mark them done, and delete them. Your tasks stay saved in this browser.</p>
<form id="task-form" class="add-row" style="max-width:none;padding:1rem;margin-top:1rem" novalidate>
<label for="task-input" style="position:absolute;left:-9999px">New task</label>
<input type="text" id="task-input" placeholder="e.g. Submit COS 106 project by Friday" maxlength="120">
<button class="btn" type="submit">Add task</button>
</form>
<p class="error" id="task-error" role="alert"></p>
<p class="stats" id="stats"></p>
<ul id="task-list" aria-live="polite"></ul>
</main>
